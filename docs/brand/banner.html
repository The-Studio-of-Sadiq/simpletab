body{width:2560px;height:880px;overflow:hidden;font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased}

.main{flex:1;padding:80px 60px}

.card{background:#1C2436;border:2px solid rgba(255,255,255,.06);border-radius:22px;padding:36px 40px}
