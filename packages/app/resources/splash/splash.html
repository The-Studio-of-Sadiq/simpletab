<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SimpleTab</title>
<style>
@font-face { font-family: "Inter"; src: url("inter.woff2") format("woff2"); font-weight: 100 900; }
html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
.card {
  box-sizing: border-box; height: 100%; border-radius: 18px; overflow: hidden; position: relative;
  background: radial-gradient(420px 260px at 22% 30%, #1D2A4A 0%, transparent 70%), linear-gradient(125deg, #0E1424 0%, #131B30 60%, #0F1628 100%);
  border: 1px solid rgba(255, 255, 255, 0.08);
  font-family: "Inter", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
}
.band { position: absolute; top: -200px; width: 220px; height: 900px; transform: rotate(32deg);
  background: linear-gradient(180deg, rgba(61, 139, 255, 0.10), rgba(124, 92, 242, 0.03)); }
.b1 { left: 380px; } .b2 { left: 520px; width: 70px; background: rgba(124, 92, 242, 0.08); }
.brand { display: flex; align-items: center; gap: 22px; position: relative; }
svg { width: 78px; height: 85px; }
h1 { margin: 0; color: #F5F7FB; font-size: 56px; font-weight: 620; letter-spacing: -1.8px; }
p { margin: 0; color: #A7B2C8; font-size: 17px; letter-spacing: 0.2px; position: relative; }
.bar { position: relative; width: 180px; height: 3px; border-radius: 3px; background: rgba(255, 255, 255, 0.08); overflow: hidden; margin-top: 10px; }
.bar::after { content: ""; position: absolute; inset: 0; width: 40%; border-radius: 3px;
  background: linear-gradient(90deg, #3D8BFF, #7C5CF2); animation: slide 1.4s ease-in-out infinite; }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
@media (prefers-reduced-motion: reduce) { .bar::after { animation: none; width: 100%; } }
</style>
</head>
<body>
<div class="card" role="img" aria-label="SimpleTab is starting">
  <div class="band b1"></div><div class="band b2"></div>
  <div class="brand"><svg viewBox="-8 -8 176 192" aria-hidden="true"><defs><linearGradient id="st-blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3D8BFF"/><stop offset="1" stop-color="#1E66F5"/></linearGradient><linearGradient id="st-violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8E6CF7"/><stop offset="1" stop-color="#6A47E0"/></linearGradient><linearGradient id="st-violet2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7C5CF2"/><stop offset="1" stop-color="#5B3BD6"/></linearGradient></defs>
<g stroke-linejoin="round" stroke-width="6"><path d="M4 40 L96 2 L154 30 L56 76 L4 100 Z" fill="url(#st-blue)" stroke="url(#st-blue)"/><path d="M62 89 L112 64 L156 86 L156 111 L106 136 L62 114 Z" fill="url(#st-violet)" stroke="url(#st-violet)"/><path d="M4 153 L56 128 L108 153 L56 179 Z" fill="url(#st-violet2)" stroke="url(#st-violet2)"/></g></svg><h1>SimpleTab</h1></div>
  <p>Organize. Tabulate. Preserve.</p>
  <div class="bar"></div>
</div>
</body>
</html>
