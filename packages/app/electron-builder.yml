appId: app.simpletab.desktop
productName: SimpleTab
copyright: SimpleTab Contributors
directories:
  output: dist
files:
  - lib/**
  - package.json
asar: true
asarUnpack:
  - "**/*.node"
win:
  target:
    - nsis
  sign: null
  forceCodeSigning: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
publish:
  provider: github
