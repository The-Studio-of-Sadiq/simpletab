appId: app.simpletab.desktop
productName: SimpleTab
copyright: SimpleTab Contributors
directories:
  output: dist
files:
  - lib/**
  - package.json
  - resources/icons/**
  - resources/splash/**
asar: true
asarUnpack:
  - "**/*.node"
icon: resources/icons/icon-512.png
win:
  target:
    - nsis
  sign: null
  forceCodeSigning: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
publish:
  provider: github
