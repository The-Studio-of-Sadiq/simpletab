name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Windows and Linux both, so draw determinism and file hashes are checked on each.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24: better-sqlite3 ships prebuilt Windows binaries for it, so CI needs no C++ build tools.
          node-version: 24
          cache: npm
      - name: Linux build headers for Theia's native modules
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbfile-dev libsecret-1-dev
      - run: npm ci
      - name: Lint and type check
        run: npm run lint
      - name: Port check (core stays free of Node, DOM and React)
        run: npm run port-check
      - name: Tests (core and the Tabbycat comparison)
        run: npm test
