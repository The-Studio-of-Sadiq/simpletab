name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Windows and Linux both, so draw determinism and file hashes are checked on each.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint and type check
        run: npm run lint
      - name: Port check (core stays free of Node, DOM and React)
        run: npm run port-check
      - name: Tests (core and the Tabbycat comparison)
        run: npm test
